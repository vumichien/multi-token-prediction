[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mtp-benchmark"
version = "0.1.0"
description = "Gemma baseline versus assistant-model benchmark harness."
requires-python = "==3.11.*"
dependencies = [
  "accelerate==1.14.0",
  "bitsandbytes==0.49.2",
  "pandas==3.0.3",
  "pillow==12.3.0",
  "psutil==7.2.2",
  "pytest==9.1.1",
  "safetensors==0.8.0",
  "sentencepiece==0.2.2",
  "torch==2.11.0+cu128",
  "torchvision==0.26.0+cu128",
  "transformers==5.14.1",
]

[project.optional-dependencies]
# Only needed to re-render the article GIFs under assets/gifs/scenes/.
# Kept out of the runtime dependencies so the benchmark harness stays lean.
gifs = [
  "matplotlib==3.11.1",
]

[project.scripts]
mtp-benchmark = "mtp_benchmark.cli:main"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
